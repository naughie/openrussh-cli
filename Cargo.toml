[package]
name = "openrussh-cli"
version = "0.2.2"
edition = "2024"
repository = "https://github.com/naughie/openrussh-cli"

[[bin]]
name = "ssh"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
mlua = { version = "0.11", default-features = false, features = ["vendored", "lua54", "serde", "error-send"] }
nix = { version = "0.31", features = ["fs", "hostname", "net", "process", "signal", "term"] }
openrussh-client = { version = "0.4", default-features = false, features = ["aws-lc-rs", "rsa", "flate2", "config-parser", "known-hosts", "local-stream-forwarding", "local-tcp-forwarding", "process"] }
serde = { version = "1.0", features = ["derive"] }
terminal_size = "0.4"
whoami = "2.1"
toml = { version = "1.2", default-features = false, features = ["std", "parse", "serde"] }
tokio = { version = "1.54", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "tracing-log"] }

[dev-dependencies]
rand = "0.10"
tempfile = "3.27"
tokio = { version = "1.54", features = ["process"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
strip = "symbols"
