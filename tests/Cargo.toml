[workspace]
members = ["cli", "stdio", "terminal", "signals", "host-key-prompt", "listeners", "tester"]
exclude = ["target"]
resolver = "3"

[workspace.dependencies]
t = { package = "tester", path = "./tester" }
anyhow = "1.0"
libtest-mimic = "0.8"
nix = { version = "0.31", features = ["fs", "process", "signal", "term"] }
tempfile = "3.27"
tokio = { version = "1.54", features = ["full"] }
